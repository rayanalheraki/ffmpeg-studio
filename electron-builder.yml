appId: com.ffmpegstudio.app
productName: FFmpeg Studio
copyright: Copyright © FFmpeg Studio contributors

directories:
  buildResources: build
  output: release/${version}

files:
  - out/**
  - resources/**
  - package.json
  - '!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,test,tests,__tests__,example,examples,docs}/**'

# Binaries cannot run from inside the asar archive.
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**

npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  # ffprobe-static ships every platform; keep only the one being packaged.
  files:
    - '!node_modules/ffprobe-static/bin/darwin/**'
    - '!node_modules/ffprobe-static/bin/linux/**'
    - '!node_modules/ffprobe-static/bin/win32/ia32/**'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: ${productName}-${version}-Setup.${ext}

mac:
  target:
    - target: dmg
  category: public.app-category.video
  icon: build/icon.png
  hardenedRuntime: true
  files:
    - '!node_modules/ffprobe-static/bin/win32/**'
    - '!node_modules/ffprobe-static/bin/linux/**'

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  icon: build/icon.png
  maintainer: FFmpeg Studio contributors
  files:
    - '!node_modules/ffprobe-static/bin/win32/**'
    - '!node_modules/ffprobe-static/bin/darwin/**'
    - '!node_modules/ffprobe-static/bin/linux/ia32/**'

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
