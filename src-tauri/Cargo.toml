[package]
name = "ffmpeg-studio"
version = "1.0.0"
description = "A calm, modern desktop GUI for FFmpeg"
authors = ["FFmpeg Studio contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "ffmpeg_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
shared_child = "1"

# The installer size matters more than build time.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
